[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra
markers =
    browser: drives a real browser, so it needs Google Chrome or `playwright install chromium`
# Starlette's TestClient prefers a newer HTTP package, but the app itself uses httpx, so the tests do too.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
